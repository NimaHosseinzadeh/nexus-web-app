<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="css/remixicon.css" />
    <!-- =================== CSS FILES =================== -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/headerDarkMode.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!-- ==================== HEADER ==================== -->
    <header id="header" class="header">
      <div class="header__container container">
        <!-- Primary Section: Brand & Navigation -->
        <div class="header__primary">
          <a href="#" class="header__logo"></a>

          <nav class="header__nav">
            <ul class="header__menu"></ul>
          </nav>
          <button
            class="header__toggle-btn"
            id="menuToggle"
            aria-label="Toggle Menu"
          >
            <i class="ri-menu-line header__toggle-icon"></i>
          </button>
        </div>
        <!-- ===================== ==========================-->
        <!-- Secondary Section: Utilities & Actions -->
        <div class="header__secondary">
          <!-- Theme & Language Tools -->
          <div class="header__utility">
            <button class="header__util-btn header__util-btn--lang">
              <i class="ri-global-line header__util-icon"></i>
            </button>

            <button class="header__util-btn header__util-btn--theme">
              <i class="ri-moon-clear-line header__util-icon"></i>
            </button>
          </div>

          <!-- Auth Buttons -->
          <div class="header__auth">
            <button class="btn btn--outline btn--login" type="button">
              Log In
            </button>

            <button class="btn btn--primary btn--signup" type="button">
              Sign Up
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- =================== JS FILES =================== -->
    <script src="script/script.js"></script>
  </body>
</html>
